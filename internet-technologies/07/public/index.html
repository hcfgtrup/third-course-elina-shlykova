<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Библиотека (CRUD)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Моя библиотека</h1>

    <form id="book-form">
      <input type="text" id="title" placeholder="Название книги" required>
      <input type="text" id="author" placeholder="Автор" required>
      <input type="number" id="year" placeholder="Год (необязательно)">
      <button type="submit">Добавить книгу</button>
    </form>

    <p id="message"></p>
    
    <div class="controls">
      <button id="refresh-btn">Обновить список</button>
    </div>

    <ul id="book-list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
