<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛР 5 — Заполнение областей</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Flood Fill & Scanline Fill</h1>
    
    <div class="layout">
      <section class="panel">
        <h2>Управление</h2>
        <button id="drawPoly">Нарисовать контур</button>
        <button id="clearBtn">Очистить</button>
        
        <h2>Flood Fill</h2>
        <p style="font-size: 13px; color: #555;">Кликните внутри контура на холсте для заливки.</p>
        
        <h2>Scanline Fill</h2>
        <button id="scanlineBtn">Залить Scanline</button>
      </section>

      <section class="canvas-wrapper">
        <canvas id="canvas" width="600" height="450"></canvas>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
